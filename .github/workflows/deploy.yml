name: Deploy to AWS App Runner

# Auto-deploy on merge to main (replaces Vercel's git-push deploy). Reuses the
# existing CodeBuild project, which builds the image, pushes it to ECR, and
# triggers the App Runner deployment. Auth is keyless via GitHub OIDC — no AWS
# credentials are stored in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # The gate (added with CI, 2026-09-09). Merges to main auto-deploy to prod
  # with migrations applying on boot, so the full suite + typecheck must pass
  # BEFORE anything ships. Mirrors ci.yml's job (which gates PRs); it runs
  # here rather than in ci.yml so the deploy can `needs:` it — a red main
  # never reaches CodeBuild.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::952078552817:role/DreamCRMGitHubActionsDeploy
          aws-region: us-east-1

      - name: Package the committed source
        run: git archive --format=zip HEAD -o /tmp/src.zip

      - name: Upload source to the CodeBuild bucket
        # TWO keys on purpose (2026-08-25). The fixed key is what the CodeBuild
        # project reads today; the SHA key exists so a build can be PINNED to
        # the commit that triggered it. With only the fixed key, a build reads
        # whatever zip is newest at fetch time — nothing ties a build to its
        # commit, and the silent failure mode of that is deploying the wrong
        # commit while reporting success.
        run: |
          aws s3 cp /tmp/src.zip "s3://dreamcrm-codebuild-952078552817/source/${GITHUB_SHA}.zip"
          aws s3 cp /tmp/src.zip s3://dreamcrm-codebuild-952078552817/source/dreamcrm-src.zip

      - name: Build image + deploy (CodeBuild -> ECR -> App Runner)
        run: |
          set -euo pipefail
          # PINNED to this commit's own zip (verified 2026-08-25: the CodeBuild
          # role's s3:GetObject covers the whole source bucket). Without the
          # override, a build read whatever sat at the fixed key at fetch time
          # — nothing tied a build to the commit that triggered it, and the
          # silent failure mode of that was deploying the wrong commit while
          # reporting success.
          BID=$(aws codebuild start-build --project-name dreamcrm-image-build --source-location-override "dreamcrm-codebuild-952078552817/source/${GITHUB_SHA}.zip" --query 'build.id' --output text)
          echo "CodeBuild started: $BID"
          # Tight 5s polling (was 15s). Saves up to ~10s of overhang once
          # the build finishes; the API call is cheap.
          while true; do
            ST=$(aws codebuild batch-get-builds --ids "$BID" --query 'builds[0].buildStatus' --output text)
            echo "build status: $ST"
            [ "$ST" != "IN_PROGRESS" ] && break
            sleep 5
          done
          if [ "$ST" != "SUCCEEDED" ]; then
            echo "::error::CodeBuild finished with status $ST"
            exit 1
          fi
          echo "Build succeeded — App Runner deployment triggered by the buildspec (start-deployment)."

      # NO rollout hold here any more (2026-08-25). App Runner allows ONE
      # rollout at a time, and three deploys on 2026-08-23 died at the
      # buildspec's start-deployment ("isn't in RUNNING state") when a
      # back-to-back merge landed inside the previous rollout's window — after
      # the new image was already pushed, so prod silently stayed on the OLDER
      # commit until the next merge. The fix lives in the CodeBuild project's
      # buildspec now: start-deployment retries until the previous rollout
      # clears (30×30s cap). A 7-minute lock hold briefly stood in for it
      # while that buildspec edit waited on access.

      # Self-heal the EventBridge cron schedules on every deploy. The script is
      # idempotent (create-if-missing, update-if-different), so a newly-added
      # cron route can never again ship with no schedule (the drift that left
      # prospecting discovery + several other jobs silently un-fired). Runs
      # after the deploy and never blocks it — a transient failure just warns.
      - name: Sync EventBridge cron schedules
        continue-on-error: true
        run: bash scripts/setup-cron-schedules.sh

  # THE DEPLOY IS NOT FINISHED UNTIL THE MIGRATIONS ARE IN (DREAMCRM-46).
  #
  # Everything above reports success once CodeBuild has pushed the image and
  # the buildspec has asked App Runner to roll it out. The migrations run later
  # still, on the NEW container's boot, from a Dockerfile line that swallows its
  # own exit code — so until now a merge whose migration threw showed a green
  # tick here and nothing anywhere said otherwise.
  #
  # This job asks production what it has actually applied and fails THIS RUN
  # when a journal entry from this commit is missing. It cannot stop the deploy
  # — the deploy has already happened by the time the answer exists — but it is
  # what makes the green tick mean something.
  #
  # NOT `continue-on-error`, deliberately: a job that cannot turn the run red is
  # the state this issue exists to leave behind.
  #
  # It polls, so it outlives the `deploy` job by minutes. That does not lengthen
  # the deploy queue in practice: a back-to-back merge's CodeBuild already waits
  # on this rollout clearing (the buildspec's start-deployment retry), which is
  # the same moment this job stops waiting.
  migration-check:
    needs: deploy
    uses: ./.github/workflows/migration-check.yml
    secrets: inherit
