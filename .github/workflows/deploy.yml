name: Deploy to AWS App Runner

# Auto-deploy on merge to main (replaces Vercel's git-push deploy). Reuses the
# existing CodeBuild project, which builds the image, pushes it to ECR, and
# triggers the App Runner deployment. Auth is keyless via GitHub OIDC — no AWS
# credentials are stored in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# NO WORKFLOW-LEVEL CONCURRENCY. The `deploy-main` group lives on the `deploy`
# job below instead (moved 2026-09-14, DREAMCRM-46, in review of #575).
#
# What must not overlap is the App Runner rollout, which allows exactly one at a
# time — that is the `deploy` job, and it is still serialized exactly as before.
# At the workflow level the group also held the run open for everything AFTER
# the rollout, and `migration-check` polls for up to 12 minutes. Run N+1's
# `test` (~6 min) and image build used to proceed while run N's rollout
# finished; under a workflow-level group they could not start until run N's
# poll exited. The worst case was the one that mattered: on a MISMATCH the poll
# spends its full window, which is exactly when somebody is trying to land the
# fix-forward merge.
#
# Consequence worth knowing: run N's migration-check can now overlap run N+1's
# deploy. That is harmless in both directions — run N checks run N's journal,
# and N+1's journal is a superset, so whichever container answers, every entry
# run N is asking about is applied. Production being AHEAD is explicitly not a
# failure (scripts/migration-check.mjs).

permissions:
  id-token: write
  contents: read

jobs:
  # The gate (added with CI, 2026-09-09). Merges to main auto-deploy to prod
  # with migrations applying on boot, so the full suite + typecheck must pass
  # BEFORE anything ships. Mirrors ci.yml's job (which gates PRs); it runs
  # here rather than in ci.yml so the deploy can `needs:` it — a red main
  # never reaches CodeBuild.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # FULL HISTORY, AND THE FETCH STEP BELOW IS NOT ENOUGH ON ITS OWN.
        # This is the half that was missing, and it cost two blocked
        # production deploys — read the `ON A PUSH` block below before
        # removing it. Measured: 3.9s and 29 MiB for this repo's whole
        # history over sixteen branches, against ~1-2s for a depth-1 clone.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TWO GUARDS READ `origin/main`, AND THEY NEED DIFFERENT AMOUNTS OF IT.
      #
      # 1. `tests/guards/axe-baseline-ratchet.test.ts` reads every ceiling in
      #    `e2e/axe-baseline.ts` as `origin/main` has it and fails any increase
      #    — the enforcement behind "ceilings only ever go down" (DREAMCRM-60).
      #    The tip's tree is all it reads.
      # 2. `tests/guards/rulebook-state.test.ts` (DREAMCRM-109) asks whether a
      #    `STATE:` line in `docs/rulebook/` is telling the truth about what has
      #    merged. `main`'s own HISTORY is the record — a squash lands as
      #    `<subject> (#N)`, a merge commit as `Merge pull request #N` — so it
      #    walks the log and tests ancestry. That is the whole reason the guard
      #    needs no GitHub credential inside a `contents: read` job.
      #
      # On a `pull_request`, actions/checkout fetches `refs/pull/N/merge` and
      # nothing else, so `origin/main` does not resolve at all without this step.
      #
      # WHY THE `--depth=1` IS GONE. It resolved `origin/main` to a tip with NO
      # history, under which guard 2 finds zero commits, zero PR numbers, and
      # reports a clean rulebook — a narrowed reader going quiet rather than
      # red, which is the §2d defect the guard itself is written about. It
      # therefore asserts its own eyes against two floors and FAILS here rather
      # than passing blind, so a re-shallowed fetch breaks `test` loudly.
      #
      # ON A PUSH THE FETCH STEP BELOW IS A NO-OP, WHICH IS WHY THE CHECKOUT
      # ABOVE CARRIES `fetch-depth: 0`. THIS IS THE BUG THAT BLOCKED TWO
      # PRODUCTION DEPLOYS ON 2026-09-23 AND IT IS NOT OBVIOUS:
      #
      #   * on a `pull_request`, checkout holds `refs/pull/N/merge`, so
      #     `origin/main` is a ref this clone does NOT have, and the fetch
      #     below genuinely transfers main's history. Green, honestly.
      #   * on a `push` to main, checkout holds main at depth 1 and its tip
      #     ALREADY EQUALS the remote tip — so the identical fetch transfers
      #     nothing, the shallow graft stays, and `origin/main` resolves with
      #     exactly ONE commit.
      #
      # The same step, the same repository, two events, two different
      # starting states. `ci.yml` was honestly green on every PR while
      # `deploy.yml` was red on every push, and the pre-merge argument for
      # "a green PR means a green main" did not cover it, because that
      # argument was about the TREE and this difference is about the CLONE.
      # `tests/guards/rulebook-state.test.ts` asserts its own eyes and failed
      # loudly rather than reporting a clean rulebook, which is the only
      # reason this was a blocked deploy and not a silent hole.
      #
      # The cost is measured, not assumed: `main`'s full history is 46 MiB
      # packed over 1,395 commits. No filter — a blobless partial clone would
      # make guard 1's `git show origin/main:e2e/axe-baseline.ts` a lazy network
      # fetch in the middle of a required check, and trading two seconds of
      # checkout for a new flake in the merge gate is a bad trade.
      - name: Fetch main's history for the ratchet and the rulebook guard
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # The one thing that genuinely must not overlap: App Runner allows ONE
    # rollout at a time. Same group and same `cancel-in-progress: false` as the
    # workflow-level block this replaces — GitHub still keeps one pending run
    # per group, so the serialization is unchanged where it was load-bearing.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::952078552817:role/DreamCRMGitHubActionsDeploy
          aws-region: us-east-1

      - name: Package the committed source
        run: git archive --format=zip HEAD -o /tmp/src.zip

      - name: Upload source to the CodeBuild bucket
        # TWO keys on purpose (2026-08-25). The fixed key is what the CodeBuild
        # project reads today; the SHA key exists so a build can be PINNED to
        # the commit that triggered it. With only the fixed key, a build reads
        # whatever zip is newest at fetch time — nothing ties a build to its
        # commit, and the silent failure mode of that is deploying the wrong
        # commit while reporting success.
        run: |
          aws s3 cp /tmp/src.zip "s3://dreamcrm-codebuild-952078552817/source/${GITHUB_SHA}.zip"
          aws s3 cp /tmp/src.zip s3://dreamcrm-codebuild-952078552817/source/dreamcrm-src.zip

      - name: Build image + deploy (CodeBuild -> ECR -> App Runner)
        run: |
          set -euo pipefail
          # THE ROLLOUT BASELINE (DREAMCRM-86). Taken BEFORE start-build, so the
          # verification step below can tell this run's App Runner rollout from
          # a previous one — the build takes minutes, so every operation the
          # buildspec starts is comfortably on the far side of this mark, and
          # every operation from an earlier deploy is comfortably before it.
          # `scripts/rollout-check.mjs` FAILS when this is missing rather than
          # falling back to "the newest rollout", which would certify somebody
          # else's deploy.
          echo "ROLLOUT_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # PINNED to this commit's own zip (verified 2026-08-25: the CodeBuild
          # role's s3:GetObject covers the whole source bucket). Without the
          # override, a build read whatever sat at the fixed key at fetch time
          # — nothing tied a build to the commit that triggered it, and the
          # silent failure mode of that was deploying the wrong commit while
          # reporting success.
          BID=$(aws codebuild start-build --project-name dreamcrm-image-build --source-location-override "dreamcrm-codebuild-952078552817/source/${GITHUB_SHA}.zip" --query 'build.id' --output text)
          echo "CodeBuild started: $BID"
          # Tight 5s polling (was 15s). Saves up to ~10s of overhang once
          # the build finishes; the API call is cheap.
          while true; do
            ST=$(aws codebuild batch-get-builds --ids "$BID" --query 'builds[0].buildStatus' --output text)
            echo "build status: $ST"
            [ "$ST" != "IN_PROGRESS" ] && break
            sleep 5
          done
          if [ "$ST" != "SUCCEEDED" ]; then
            echo "::error::CodeBuild finished with status $ST"
            exit 1
          fi
          echo "Build succeeded — App Runner deployment triggered by the buildspec (start-deployment)."

      # GREEN MUST MEAN SERVING (DREAMCRM-86).
      #
      # The step above exits the moment the BUILD reports SUCCEEDED, and the
      # rollout is fired from the buildspec's POST_BUILD after that point.
      # Nothing downstream watched it, so on 2026-09-21 a merge reported green
      # on `test`, `e2e`, this job and `migration-check` while production served
      # the previous build for 2h 40m (docs/RELEASE.md Part 5, measured by etag).
      # A rollout that is accepted and then does not land looked exactly like one
      # that did.
      #
      # `scripts/rollout-check.mjs` finds the operation the buildspec started —
      # identified by ROLLOUT_SINCE, recorded above before `start-build` — polls
      # it until it leaves IN_PROGRESS, and fails on anything but SUCCEEDED.
      # ROLLBACK_SUCCEEDED is a FAILURE: it is App Runner saying the new version
      # failed its health check and the previous one is back.
      #
      # NOT `continue-on-error`. A job that cannot turn the run red is the state
      # this closes — same reasoning as `migration-check` below.
      #
      # IT EXTENDS THE `deploy-main` HOLD, ON PURPOSE. The group exists because
      # App Runner allows ONE rollout at a time, and until now the job released
      # it while the rollout was still running — the real serialization was the
      # buildspec's 30x30s start-deployment retry. Holding the group until the
      # rollout is genuinely done is what the group always claimed to do. The
      # cost is that a back-to-back merge's image build now queues behind this
      # instead of racing it; the saving is that its start-deployment no longer
      # has to retry into a busy service. `migration-check` stays outside the
      # group either way, which is what that split was for.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the App Runner rollout actually served
        env:
          # Optional. Left unset, the check resolves the service ARN by name
          # through `apprunner list-services`.
          APP_RUNNER_SERVICE_ARN: ${{ vars.APP_RUNNER_SERVICE_ARN }}
          APP_RUNNER_SERVICE_NAME: dreamcrm
        # No `pnpm install`: the script imports node builtins only, so this
        # alarm has no dependency tree to fail on. Same rule as migration-check.
        run: node scripts/rollout-check.mjs

      # NO rollout hold here any more (2026-08-25). App Runner allows ONE
      # rollout at a time, and three deploys on 2026-08-23 died at the
      # buildspec's start-deployment ("isn't in RUNNING state") when a
      # back-to-back merge landed inside the previous rollout's window — after
      # the new image was already pushed, so prod silently stayed on the OLDER
      # commit until the next merge. The fix lives in the CodeBuild project's
      # buildspec now: start-deployment retries until the previous rollout
      # clears (30×30s cap). A 7-minute lock hold briefly stood in for it
      # while that buildspec edit waited on access.

      # Self-heal the EventBridge cron schedules on every deploy. The script is
      # idempotent (create-if-missing, update-if-different), so a newly-added
      # cron route can never again ship with no schedule (the drift that left
      # prospecting discovery + several other jobs silently un-fired). Runs
      # after the deploy and never blocks it — a transient failure just warns.
      #
      # `if: !cancelled()` because the rollout check above now sits in front of
      # it, and a failed step stops the ones after it — `continue-on-error` on
      # THIS step does not change that. On a genuine rollout failure skipping
      # the sync would be defensible; on a failure the degrade path
      # deliberately does not cover (an unparseable response, a bad ARN, a
      # throttle outlasting its retries) the new code IS serving and its
      # schedules would never be reconciled, which is exactly the drift this
      # step exists to prevent. `!cancelled()` rather than `always()`: a job
      # superseded in the `deploy-main` group has nothing to reconcile.
      # (Sentinel, review of #639.)
      - name: Sync EventBridge cron schedules
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/setup-cron-schedules.sh

  # THE DEPLOY IS NOT FINISHED UNTIL THE MIGRATIONS ARE IN (DREAMCRM-46).
  #
  # Everything above reports success once CodeBuild has pushed the image and
  # the buildspec has asked App Runner to roll it out. The migrations run later
  # still, on the NEW container's boot, from a Dockerfile line that swallows its
  # own exit code — so until now a merge whose migration threw showed a green
  # tick here and nothing anywhere said otherwise.
  #
  # This job asks production what it has actually applied and fails THIS RUN
  # when a journal entry from this commit is missing. It cannot stop the deploy
  # — the deploy has already happened by the time the answer exists — but it is
  # what makes the green tick mean something.
  #
  # NOT `continue-on-error`, deliberately: a job that cannot turn the run red is
  # the state this issue exists to leave behind.
  #
  # It polls, so it outlives the `deploy` job by minutes — up to 12 of them on a
  # red result. That is why the `deploy-main` concurrency group sits on the
  # `deploy` job rather than on this workflow (see the note at the top): this job
  # is deliberately OUTSIDE it, so the poll cannot hold up the next merge's
  # deploy. An earlier draft argued the wait was free because the next merge's
  # CodeBuild already waits on this rollout clearing — that is true of
  # `start-deployment` and false of the queue, since the next run's `test` and
  # image build (~15 min) used to run concurrently with this rollout and would
  # have been stalled behind the poll instead.
  migration-check:
    needs: deploy
    uses: ./.github/workflows/migration-check.yml
    secrets: inherit
