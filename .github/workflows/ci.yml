name: CI

# The test gate. Every repo convention that says "fails CI" is enforced here:
# typecheck + the FULL vitest suite (the repo-wide guards — tenant scoping,
# cron parity, token single-homes, legibility floor — only run in a full pass).
#
# PRs are gated by this workflow; pushes to main are gated by the identical
# `test` job inside deploy.yml, which the deploy job depends on — that way a
# red main can never auto-ship, and tests don't run twice per merge.
on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # FULL HISTORY, AND THE FETCH STEP BELOW IS NOT ENOUGH ON ITS OWN.
        # This is the half that was missing, and it cost two blocked
        # production deploys — read the `ON A PUSH` block below before
        # removing it. Measured: 3.9s and 29 MiB for this repo's whole
        # history over sixteen branches, against ~1-2s for a depth-1 clone.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TWO GUARDS READ `origin/main`, AND THEY NEED DIFFERENT AMOUNTS OF IT.
      #
      # 1. `tests/guards/axe-baseline-ratchet.test.ts` reads every ceiling in
      #    `e2e/axe-baseline.ts` as `origin/main` has it and fails any increase
      #    — the enforcement behind "ceilings only ever go down" (DREAMCRM-60).
      #    The tip's tree is all it reads.
      # 2. `tests/guards/rulebook-state.test.ts` (DREAMCRM-109) asks whether a
      #    `STATE:` line in `docs/rulebook/` is telling the truth about what has
      #    merged. `main`'s own HISTORY is the record — a squash lands as
      #    `<subject> (#N)`, a merge commit as `Merge pull request #N` — so it
      #    walks the log and tests ancestry. That is the whole reason the guard
      #    needs no GitHub credential inside a `contents: read` job.
      #
      # On a `pull_request`, actions/checkout fetches `refs/pull/N/merge` and
      # nothing else, so `origin/main` does not resolve at all without this step.
      #
      # WHY THE `--depth=1` IS GONE. It resolved `origin/main` to a tip with NO
      # history, under which guard 2 finds zero commits, zero PR numbers, and
      # reports a clean rulebook — a narrowed reader going quiet rather than
      # red, which is the §2d defect the guard itself is written about. It
      # therefore asserts its own eyes against two floors and FAILS here rather
      # than passing blind, so a re-shallowed fetch breaks `test` loudly.
      #
      # ON A PUSH THE FETCH STEP BELOW IS A NO-OP, WHICH IS WHY THE CHECKOUT
      # ABOVE CARRIES `fetch-depth: 0`. THIS IS THE BUG THAT BLOCKED TWO
      # PRODUCTION DEPLOYS ON 2026-09-23 AND IT IS NOT OBVIOUS:
      #
      #   * on a `pull_request`, checkout holds `refs/pull/N/merge`, so
      #     `origin/main` is a ref this clone does NOT have, and the fetch
      #     below genuinely transfers main's history. Green, honestly.
      #   * on a `push` to main, checkout holds main at depth 1 and its tip
      #     ALREADY EQUALS the remote tip — so the identical fetch transfers
      #     nothing, the shallow graft stays, and `origin/main` resolves with
      #     exactly ONE commit.
      #
      # The same step, the same repository, two events, two different
      # starting states. `ci.yml` was honestly green on every PR while
      # `deploy.yml` was red on every push, and the pre-merge argument for
      # "a green PR means a green main" did not cover it, because that
      # argument was about the TREE and this difference is about the CLONE.
      # `tests/guards/rulebook-state.test.ts` asserts its own eyes and failed
      # loudly rather than reporting a clean rulebook, which is the only
      # reason this was a blocked deploy and not a silent hole.
      #
      # WHICH MECHANISM ACTUALLY BRINGS THE HISTORY, because this paragraph
      # used to get it wrong and that is what froze the deploy pipeline:
      #
      #   * THE CHECKOUT does the deepening, on every event. `fetch-depth: 0`
      #     above is the only thing that is true on all three triggers.
      #   * THE FETCH STEP below does NOT deepen anything. On a `pull_request`
      #     it creates `refs/remotes/origin/main`, which a PR checkout has no
      #     reason to have; on a `push` or a `schedule` it is a cheap no-op,
      #     because the checkout already holds main and its tip. It stays
      #     because it is what guarantees `origin/main` names the current
      #     remote tip, and because the axe census requires the refspec before
      #     each `pnpm test`.
      #
      # Do not read the fetch line as the thing that makes the guards work.
      # It was, once, on exactly one of the three triggers.
      #
      # The cost is measured, not assumed, and it is the CHECKOUT's cost:
      # cloning this repository complete took 3.9s for 29 MiB of `.git` over
      # 1,420 commits and sixteen branches, against ~1-2s at depth 1.
      #
      # NO FILTER, and that decision now belongs to the checkout too
      # (`actions/checkout` takes a `filter:` input). TWO consumers depend on
      # it:
      #   * guard 1 reads a blob of an old commit
      #     (`git show origin/main:e2e/axe-baseline.ts`);
      #   * guard 2's `rulebookEditedSince` runs
      #     `git diff --quiet <sha> -- docs/rulebook`, which is also a
      #     blob-level read of an old commit.
      # Under `--filter=blob:none` each of those becomes a LAZY NETWORK FETCH
      # inside a required check. Trading two seconds of checkout for a new
      # flake in the merge gate is a bad trade, and it is a worse one now than
      # when the filter was first refused. (Sentinel, #685 note 3 — the next
      # person reading a size in MiB will reach for the filter.)
      - name: Fetch main's history for the ratchet and the rulebook guard
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The automated accessibility gate (2026-09-10). eslint-plugin-jsx-a11y
      # on a curated rule set — see eslint.config.mjs for what is on, what is
      # deliberately off, and why. Before this every a11y defect in the repo
      # was found by a person reading components one at a time.
      #
      # It runs BEFORE the suite on purpose: it takes seconds where the suite
      # takes minutes, so a missing label fails fast.
      #
      # PR-side only, like the e2e job below and unlike typecheck+test: every
      # write to main goes through a PR, so this gate is complete in practice,
      # and deploy.yml's mirror stays a pure production-safety gate. A missing
      # accessible name is a quality defect, not something that should be able
      # to hold up a deploy that has already passed here.
      - name: Accessibility lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # The browser suite, as its own job per docs/E2E.md ("wire it into CI as its
  # own job, not into the unit gate"). The harness stands up a throwaway
  # Postgres from the runner image's own binaries, applies every migration
  # from zero (a deploy-path rehearsal), builds, serves, and runs Playwright.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the E2E harness
        run: bash scripts/e2e-harness.sh

      # A RETRY THAT LEAVES NO TRACE IS HOW A FLAKE SURVIVES FOR WEEKS
      # (DREAMCRM-33). `playwright.config.ts` sets `retries: 1` under CI, and
      # that is the right call — harness noise should not paint a required
      # check red. But until now the retry also erased the evidence: a spec
      # that failed once and passed on the second attempt reported this job
      # GREEN, and the upload below only fired `if: failure()`, so the trace
      # and screenshot from the failed attempt died with the runner. The
      # portal-reschedule flake (DREAMCRM-21) did exactly that three times.
      #
      # `if: always()` so it also reports when the suite genuinely failed —
      # a run can be both red AND flaky, and the flaky half is still worth
      # naming. The script never exits non-zero (see its header): a reporting
      # step that can turn a run red is one somebody eventually deletes.
      - name: Name any test that only passed on a retry
        id: flaky
        if: always()
        run: node scripts/e2e-flaky-summary.mjs

      # `failure() || flaky` — the whole point of the change. A green-but-flaky
      # run now keeps its report for the 7-day window, which is the only place
      # the first attempt's trace and screenshot exist.
      - name: Upload Playwright report
        if: failure() || steps.flaky.outputs.flaky == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-results.json
          retention-days: 7
