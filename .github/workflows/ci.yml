name: CI

# The test gate. Every repo convention that says "fails CI" is enforced here:
# typecheck + the FULL vitest suite (the repo-wide guards — tenant scoping,
# cron parity, token single-homes, legibility floor — only run in a full pass).
#
# PRs are gated by this workflow; pushes to main are gated by the identical
# `test` job inside deploy.yml, which the deploy job depends on — that way a
# red main can never auto-ship, and tests don't run twice per merge.
on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # The browser suite, as its own job per docs/E2E.md ("wire it into CI as its
  # own job, not into the unit gate"). The harness stands up a throwaway
  # Postgres from the runner image's own binaries, applies every migration
  # from zero (a deploy-path rehearsal), builds, serves, and runs Playwright.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the E2E harness
        run: bash scripts/e2e-harness.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
