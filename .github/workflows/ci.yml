name: CI

# The test gate. Every repo convention that says "fails CI" is enforced here:
# typecheck + the FULL vitest suite (the repo-wide guards — tenant scoping,
# cron parity, token single-homes, legibility floor — only run in a full pass).
#
# PRs are gated by this workflow; pushes to main are gated by the identical
# `test` job inside deploy.yml, which the deploy job depends on — that way a
# red main can never auto-ship, and tests don't run twice per merge.
on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The automated accessibility gate (2026-09-10). eslint-plugin-jsx-a11y
      # on a curated rule set — see eslint.config.mjs for what is on, what is
      # deliberately off, and why. Before this every a11y defect in the repo
      # was found by a person reading components one at a time.
      #
      # It runs BEFORE the suite on purpose: it takes seconds where the suite
      # takes minutes, so a missing label fails fast.
      #
      # PR-side only, like the e2e job below and unlike typecheck+test: every
      # write to main goes through a PR, so this gate is complete in practice,
      # and deploy.yml's mirror stays a pure production-safety gate. A missing
      # accessible name is a quality defect, not something that should be able
      # to hold up a deploy that has already passed here.
      - name: Accessibility lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # The browser suite, as its own job per docs/E2E.md ("wire it into CI as its
  # own job, not into the unit gate"). The harness stands up a throwaway
  # Postgres from the runner image's own binaries, applies every migration
  # from zero (a deploy-path rehearsal), builds, serves, and runs Playwright.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the E2E harness
        run: bash scripts/e2e-harness.sh

      # A RETRY THAT LEAVES NO TRACE IS HOW A FLAKE SURVIVES FOR WEEKS
      # (DREAMCRM-33). `playwright.config.ts` sets `retries: 1` under CI, and
      # that is the right call — harness noise should not paint a required
      # check red. But until now the retry also erased the evidence: a spec
      # that failed once and passed on the second attempt reported this job
      # GREEN, and the upload below only fired `if: failure()`, so the trace
      # and screenshot from the failed attempt died with the runner. The
      # portal-reschedule flake (DREAMCRM-21) did exactly that three times.
      #
      # `if: always()` so it also reports when the suite genuinely failed —
      # a run can be both red AND flaky, and the flaky half is still worth
      # naming. The script never exits non-zero (see its header): a reporting
      # step that can turn a run red is one somebody eventually deletes.
      - name: Name any test that only passed on a retry
        id: flaky
        if: always()
        run: node scripts/e2e-flaky-summary.mjs

      # `failure() || flaky` — the whole point of the change. A green-but-flaky
      # run now keeps its report for the 7-day window, which is the only place
      # the first attempt's trace and screenshot exist.
      - name: Upload Playwright report
        if: failure() || steps.flaky.outputs.flaky == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-results.json
          retention-days: 7
