name: Review gate

# THE REVIEW GATE LEARNS WHICH FILES ARE RISKY (DREAMCRM-33 item 2, Sentinel's
# proposal from the DREAMCRM-31 meeting).
#
# The repo has had a pre-merge review gate since the Foundations cycle — money,
# tenant scoping, auth and token surfaces, DB migrations, CI workflow files,
# branch protection, the deploy pipeline. It lived entirely in a skill document
# and in the habits of whoever happened to be reading it. Nothing in the
# repository knew the list, so nothing could ever OBJECT: a forgotten review
# request on a fee calculation or a migration merged green, every check passing,
# no part of the system aware a rule had been skipped. PR #517 did exactly that
# — a workflow-file edit riding along in a UI-polish PR.
#
# ============================ THIS DOES NOT GATE =============================
#
# Read this before deciding what the change is. This workflow labels a PR and
# writes a job summary. It is NOT a required status check on `main` (those are
# `test` and `e2e`, from ci.yml, and this adds neither name), it has no
# `needs:` relationship to anything, and it cannot stop a merge. Three reasons
# that is the right shape and not timidity:
#
#   * An advisory that is right 100% of the time is worth more than a blocker
#     that is right 95%. The gate list is a policy enumeration; the day it is
#     slightly wrong should cost a conversation, not a blocked production fix.
#   * It cannot tell whether the review HAPPENED — only that one is owed. A
#     check that blocks on a fact it cannot observe has to be overridden
#     routinely, and a routinely-overridden check is decoration.
#   * A blocking check here would sit in front of the riskiest PRs in the repo,
#     which is precisely where an outage of this workflow must not land.
#
# Making it required later is a branch-protection change, which is itself
# behind the review gate. Do not do it by editing this file.
#
# RE-DECIDED DELIBERATELY ON DREAMCRM-49 (2026-09-14), not carried over by
# habit: it stays advisory. The blocking version needs a pass signal that can
# be set on the PR, and the only signals available — a label, a GitHub review —
# can be minted by the single admin account the whole agent fleet
# authenticates as. That would read as enforcement while being weaker than an
# honest advisory. What would change the answer, and the before/after, are on
# the DREAMCRM-49 issue.
# =============================================================================
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Labelling the PR is the whole point of the write scope. Nothing here reads
  # or writes code, secrets, or any other repository content.
  pull-requests: write
  # READ-ONLY, AND IT IS LOAD-BEARING (DREAMCRM-130). The label timeline lives
  # on the ISSUES side of the API (`/issues/{n}/events`) even for a pull
  # request, and it is what tells the removal step whether a label is this
  # workflow's own or a person's. Trim this and the fetch 404s: the reader
  # fails closed, so nothing is stripped by mistake, but the gate quietly
  # stops removing stale labels at all and the sweep starts asking about PRs
  # for ever. `tests/guards/review-gate.test.ts` holds it here for that reason.
  issues: read

jobs:
  # NOT named `test` or `e2e`: those are the required status-check contexts on
  # main's branch protection, and a second producer of either name can report a
  # green check onto a commit the real gate never ran against. The name says
  # what it is so nobody has to open the file to find out whether it blocks.
  review-gate:
    name: review-gate (advisory, does not block the merge)
    runs-on: ubuntu-latest
    # This job installs nothing and runs one small node script; it has no
    # business taking minutes, let alone inheriting GitHub's 6-hour default.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `gh pr diff` rather than a `git diff` against a fetched base: the
      # script needs the same file list a reviewer would see, and asking GitHub
      # for it avoids depending on how deep the checkout happens to be. `gh` is
      # preinstalled on the runner image; no `pnpm install` is needed anywhere
      # in this job, which is why it finishes in seconds.
      - name: Which files does this PR touch?
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff ${{ github.event.pull_request.number }} --name-only > changed-files.txt

      - name: Classify them against the gate list
        id: gate
        run: node scripts/review-gate.mjs changed-files.txt

      # WHO PUT THE LABELS THERE (DREAMCRM-130).
      #
      # The removal below is allowed only for a label THIS WORKFLOW applied, and
      # the issue-events timeline is the only place on a PR that records who
      # applied one. It is append-only, so a push cannot rewrite it.
      #
      # `--paginate --jq '.[]'` on purpose: `--paginate` on an array endpoint
      # concatenates arrays, which is not valid JSON, so the jq filter flattens
      # it to one object per line instead. `continue-on-error` because this must
      # never paint an advisory check red — and a failed fetch leaves an empty
      # file, which the reader below treats as UNREADABLE and answers KEEP.
      - name: Who applied the labels this PR is carrying?
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/events
        run: |
          # A PARTIAL FETCH IS NOT A SHORT ANSWER, IT IS NO ANSWER (Sentinel,
          # reviewing #716 — the fifth uncertainty, and the only one that failed
          # OPEN). `--paginate` streams each page to the file AS IT ARRIVES, so
          # a call that dies partway leaves behind JSONL that is perfectly
          # well-formed and silently truncated. The reader cannot tell it from a
          # complete one — and because this endpoint is ordered oldest-first,
          # the pages most likely to be lost are the RECENT ones, which is
          # exactly where a hand-added label lives. So the reader must never see
          # it: discard the file, because empty is the one input
          # `parseLabelEvents` reads as unreadable rather than as "no events".
          if ! gh api --paginate --jq '.[]' "$EVENTS" > label-events.jsonl; then
            echo "::warning title=Label timeline fetch failed::Discarded a possibly-partial timeline. No gate label will be removed on this run."
            : > label-events.jsonl
          fi

      # Advisory means advisory: a label that fails to apply (a permissions
      # change, a GitHub hiccup) must not paint this run red and teach people
      # the check is broken. The summary above is the real output; the label is
      # a convenience for scanning the PR list.
      # TWO LABELS, TWO OBLIGATIONS (DREAMCRM-49). `needs-sentinel-review` means
      # a reviewer has to see this before it merges. `needs-forge-intake` means
      # it may change what everyone else can merge and the rulebook has to hear
      # about it — which does NOT add a reviewer and does NOT hold the merge.
      # A PR can carry both, either, or neither; #566 carried neither and
      # should have carried the second, which is why this step now sets it.
      - name: Label the PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          NEEDS_REVIEW: ${{ steps.gate.outputs.needs-review }}
          NEEDS_INTAKE: ${{ steps.gate.outputs.needs-intake }}
        run: |
          gh label create needs-sentinel-review \
            --color B60205 \
            --description "Touches money, tenant scoping, auth, migrations, CI workflows or the deploy path" \
            || true
          gh label create needs-forge-intake \
            --color FBCA04 \
            --description "May change what can merge — tell Forge the same day (intake, not review)" \
            || true
          # REMOVING A LABEL IS NOT THE MIRROR OF ADDING ONE (DREAMCRM-130).
          #
          # Removing it still matters — a PR that drops its risky file in a
          # later push should stop claiming it owes a review. But this
          # classifier cannot tell "the risk went away" from "I never saw the
          # risk to begin with", and a HAND-ADDED label is precisely a person
          # overruling it on the second case. Until this function existed, the
          # author's next push stripped that person's label (observed on #710),
          # and `scripts/review-sweep.mjs` — which reads the label off the
          # MERGED PR — went blind with it, in the one category the classifier
          # had already failed.
          #
          # The exit code is the whole interface, and its polarity is chosen so
          # that any failure lands on KEEP: 0 means "this workflow's own label,
          # safe to take back", and every other outcome, a crash included, is
          # non-zero and leaves the label alone.
          remove_if_classifier_applied() {
            if node scripts/review-gate.mjs --label-authorship "$1" label-events.jsonl; then
              gh pr edit "$PR" --remove-label "$1" || true
            fi
          }

          if [ "$NEEDS_REVIEW" = "true" ]; then
            gh pr edit "$PR" --add-label needs-sentinel-review
          else
            remove_if_classifier_applied needs-sentinel-review
          fi
          if [ "$NEEDS_INTAKE" = "true" ]; then
            gh pr edit "$PR" --add-label needs-forge-intake
          else
            remove_if_classifier_applied needs-forge-intake
          fi
