name: Nightly

# A SCHEDULED run of the same gates CI runs on demand.
#
# Why this exists: until now nothing ran the suite except a PR or a merge, so
# a clock- or race-dependent failure could only be discovered by accident, on
# somebody else's unrelated PR, at whatever hour they happened to push. Both
# flakes found this cycle were found exactly that way. A nightly run turns
# "someone stumbles into it" into "we are told, on a schedule, before anyone
# is mid-change".
#
# Nothing here gates a merge — a red nightly is a signal to investigate, not a
# blocked branch. That is the point: it can afford to run the slower, noisier,
# more informative shape of the suite.
#
# NOTE: GitHub only runs `schedule` from the DEFAULT branch, and it disables
# scheduled workflows in a repository with 60 days of no activity. If nightly
# runs go quiet, check the Actions tab for the re-enable banner before
# assuming the suite is fine.
on:
  schedule:
    # 06:37 UTC = 02:37 EDT / 01:37 EST — after the day's merges have landed,
    # long before anyone starts work, so a red result is waiting at the start
    # of the day rather than landing in the middle of one. (Both spellings,
    # because the line this replaced said "03:00 ET" and meant EDT; a US
    # timezone is two hours depending on the month, and this file is read in
    # both.)
    #
    # THE ODD MINUTE IS THE POINT, and the 23 minutes earlier are incidental.
    # GitHub's `schedule` is best-effort and queues behind everyone else's;
    # the top of an hour is when the whole platform asks at once. This ran at
    # `0 7` for four unattended fires and landed +4h59m, +4h26m, +5h30m and
    # +6h34m late — a rising trend that put the fourth one at 09:42 ET, mid-
    # morning, which is the arrival `docs/CI.md` named as the trigger for
    # moving off the hour. Asking at :37 asks when the queue is shorter.
    #
    # It is a lever, not a fix: the delay is GitHub's scheduler and we cannot
    # control it. `docs/CI.md` ("When it really runs") carries the sample
    # table — add a row there rather than re-deriving this from memory.
    - cron: '37 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deliberately NOT named `test` / `e2e`. Those two names are the required
  # status-check contexts on `main`'s branch protection, and a name collision
  # from a hand-dispatched run of this workflow could report a green context
  # onto a commit that the real gate never ran against.
  nightly-test:
    name: nightly-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TWO GUARDS READ `origin/main`, AND THEY NEED DIFFERENT AMOUNTS OF IT.
      #
      # 1. `tests/guards/axe-baseline-ratchet.test.ts` reads every ceiling in
      #    `e2e/axe-baseline.ts` as `origin/main` has it and fails any increase
      #    — the enforcement behind "ceilings only ever go down" (DREAMCRM-60).
      #    The tip's tree is all it reads.
      # 2. `tests/guards/rulebook-state.test.ts` (DREAMCRM-109) asks whether a
      #    `STATE:` line in `docs/rulebook/` is telling the truth about what has
      #    merged. `main`'s own HISTORY is the record — a squash lands as
      #    `<subject> (#N)`, a merge commit as `Merge pull request #N` — so it
      #    walks the log and tests ancestry. That is the whole reason the guard
      #    needs no GitHub credential inside a `contents: read` job.
      #
      # On a `pull_request`, actions/checkout fetches `refs/pull/N/merge` and
      # nothing else, so `origin/main` does not resolve at all without this step.
      #
      # WHY THE `--depth=1` IS GONE. It resolved `origin/main` to a tip with NO
      # history, under which guard 2 finds zero commits, zero PR numbers, and
      # reports a clean rulebook — a narrowed reader going quiet rather than
      # red, which is the §2d defect the guard itself is written about. It
      # therefore asserts its own eyes against two floors and FAILS here rather
      # than passing blind, so a re-shallowed fetch breaks `test` loudly.
      #
      # The cost is measured, not assumed: `main`'s full history is 46 MiB
      # packed over 1,395 commits. No filter, and TWO consumers now depend on
      # that:
      #   * guard 1 reads a blob of an old commit
      #     (`git show origin/main:e2e/axe-baseline.ts`);
      #   * guard 2's `rulebookEditedSince` runs
      #     `git diff --quiet <sha> -- docs/rulebook`, which is also a
      #     blob-level read of an old commit.
      # Under `--filter=blob:none` each of those becomes a LAZY NETWORK FETCH
      # inside a required check. Trading two seconds of checkout for a new
      # flake in the merge gate is a bad trade, and it is a worse one now than
      # when the filter was first refused. (Sentinel, #685 note 3 — the next
      # person reading "46 MiB" will reach for the filter.)
      - name: Fetch main's history for the ratchet and the rulebook guard
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  nightly-e2e:
    name: nightly-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the E2E harness
        run: bash scripts/e2e-harness.sh

      # THE NIGHTLY IS THE RUN THIS MATTERS MOST FOR (DREAMCRM-33). Its whole
      # purpose is to surface clock- and race-dependent failures before anyone
      # trips over them — and `retries: 1` meant a race that showed up here
      # then passed on the second attempt produced a green nightly and no
      # evidence at all. That is the precise shape of the failure this job was
      # built to catch, quietly swallowed by the job built to catch it.
      - name: Name any test that only passed on a retry
        id: flaky
        if: always()
        run: node scripts/e2e-flaky-summary.mjs

      - name: Upload Playwright report
        if: failure() || steps.flaky.outputs.flaky == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: |
            playwright-report/
            e2e-results.json
          retention-days: 7

  # --- The timezone canary (NON-BLOCKING) ----------------------------------
  #
  # `vitest.config.ts` pins TZ=UTC on purpose: prod's clock is UTC, and an
  # unpinned suite flips results on a developer machine in a US timezone. That
  # pin is correct, and it is also the exact reason CI is blind to a whole bug
  # class — a timestamp mapper that buckets into *local* days is invisible in a
  # process whose local day IS the UTC day (DREAMCRM-13, #500/#509).
  #
  # So: run the suite once a night under America/New_York, where local days and
  # UTC days genuinely disagree, and treat a failure as an EARLY WARNING rather
  # than a verdict. `continue-on-error` keeps the nightly's overall conclusion
  # honest — this job going red must never be mistaken for "the suite broke".
  # A red canary means: some test reads the local clock. Go find out whether
  # that test is wrong, or the code under it is.
  #
  # It runs the unit suite only. E2E already exercises real clinic-local time
  # (the fixtures are America/New_York against a UTC server), so a second
  # browser pass buys nothing for four more minutes of runner.
  tz-canary:
    name: tz-canary (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # vitest.config.ts reads TEST_TZ and falls back to UTC, so this is the
      # ONLY way the pin gets overridden — no ambient TZ from a dev box or a
      # runner image can reach the suite by accident.
      TEST_TZ: America/New_York
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TWO GUARDS READ `origin/main`, AND THEY NEED DIFFERENT AMOUNTS OF IT.
      #
      # 1. `tests/guards/axe-baseline-ratchet.test.ts` reads every ceiling in
      #    `e2e/axe-baseline.ts` as `origin/main` has it and fails any increase
      #    — the enforcement behind "ceilings only ever go down" (DREAMCRM-60).
      #    The tip's tree is all it reads.
      # 2. `tests/guards/rulebook-state.test.ts` (DREAMCRM-109) asks whether a
      #    `STATE:` line in `docs/rulebook/` is telling the truth about what has
      #    merged. `main`'s own HISTORY is the record — a squash lands as
      #    `<subject> (#N)`, a merge commit as `Merge pull request #N` — so it
      #    walks the log and tests ancestry. That is the whole reason the guard
      #    needs no GitHub credential inside a `contents: read` job.
      #
      # On a `pull_request`, actions/checkout fetches `refs/pull/N/merge` and
      # nothing else, so `origin/main` does not resolve at all without this step.
      #
      # WHY THE `--depth=1` IS GONE. It resolved `origin/main` to a tip with NO
      # history, under which guard 2 finds zero commits, zero PR numbers, and
      # reports a clean rulebook — a narrowed reader going quiet rather than
      # red, which is the §2d defect the guard itself is written about. It
      # therefore asserts its own eyes against two floors and FAILS here rather
      # than passing blind, so a re-shallowed fetch breaks `test` loudly.
      #
      # The cost is measured, not assumed: `main`'s full history is 46 MiB
      # packed over 1,395 commits. No filter, and TWO consumers now depend on
      # that:
      #   * guard 1 reads a blob of an old commit
      #     (`git show origin/main:e2e/axe-baseline.ts`);
      #   * guard 2's `rulebookEditedSince` runs
      #     `git diff --quiet <sha> -- docs/rulebook`, which is also a
      #     blob-level read of an old commit.
      # Under `--filter=blob:none` each of those becomes a LAZY NETWORK FETCH
      # inside a required check. Trading two seconds of checkout for a new
      # flake in the merge gate is a bad trade, and it is a worse one now than
      # when the filter was first refused. (Sentinel, #685 note 3 — the next
      # person reading "46 MiB" will reach for the filter.)
      - name: Fetch main's history for the ratchet and the rulebook guard
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test under America/New_York
        run: pnpm test

      - name: Explain a red canary
        if: failure()
        run: |
          echo "::warning title=Timezone canary failed::The suite is green under TZ=UTC but red under America/New_York. This is an EARLY WARNING, not a broken build: something read the LOCAL clock. Find whether the test's expectation is UTC-shaped or the code under it buckets timestamps into local days (the DREAMCRM-13 bug class)."
