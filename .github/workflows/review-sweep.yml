name: Post-merge review sweep

# DID A PR THAT OWED SENTINEL A REVIEW MERGE WITHOUT ONE? (DREAMCRM-61.)
#
# `review-gate.yml` answers "is a review OWED" on every PR and labels it. Its
# own header says it cannot tell whether the review HAPPENED. Nothing else
# asked either — so the gate could label a PR perfectly, the author could
# forget, and the merge went through green with nothing aware a rule had been
# skipped.
#
# #573 and #582 both merged carrying `needs-sentinel-review` with no review.
# The gate was right twice and author memory failed twice in one batch. The
# miss surfaced a day later, in a manual sweep somebody chose to run. This is
# that sweep, on a schedule, so it stops depending on the choosing.
#
# IT GRADES `needs-forge-intake` TOO (DREAMCRM-92). Same gate, same care
# applying the label, and nothing read it: thirty merged PRs wore it on the day
# that changed. An obligation with no closing record is not a queue, it is a
# note in a drawer. Its cut-off is its own and later — see
# `INTAKE_SWEPT_SINCE` in `scripts/review-sweep.mjs` for why judging those
# thirty would have opened the half with thirty mostly-wrong findings.
#
# ============================ THIS DOES NOT GATE =============================
#
# No `pull_request` trigger, no required status-check context, no `needs:` on
# anything, and it runs entirely AFTER the merge commit is on `main` — after
# the deploy, in most cases. It cannot hold a merge and must never try to.
#
# DREAMCRM-49's ruling that `review-gate` stays advisory is untouched, and this
# is not a way round it. The reason a blocking gate was refused is that every
# available pass signal can be minted by the single admin account the whole
# agent fleet authenticates as, so it would read as enforcement while being
# weaker than an honest advisory. That argument is exactly why a SWEEP works
# where a gate did not: a gate has to survive an adversary, and a sweep only
# has to survive forgetting. Forgetting is what actually happened, twice.
#
# Do not "strengthen" this into a required check. That is DREAMCRM-49 re-argued
# from the other end, and the answer is still no.
# =============================================================================
#
# WHO READS A RED RUN — the same honest answer `post-merge-e2e.yml` gives, and
# for the same reason it is written down rather than assumed. Nothing in
# `.github/` routes a workflow failure anywhere, so delivery is GitHub's default
# failed-run notification to the account that owns the schedule, plus the
# Actions tab. That is ONE inbox. "We are told the same day" is true only while
# somebody reads it. If this starts getting ignored, give it a real addressee
# (a Slack/webhook step), do not delete it.
#
# WHY NOT A COMMENT ON THE OFFENDING PR. It was the obvious loudest channel and
# it is the wrong one here: this sweep is CUMULATIVE (see below), so an
# unremediated PR would collect one comment per day forever, and posting them
# needs `pull-requests: write` on a job that otherwise needs no write scope at
# all. A red run plus `::error::` annotations names the same PRs with neither
# cost.

on:
  # 06:47 UTC, off the hour and behind the morning pair — rulebook-drift at
  # :17, nightly at :37. The top of an hour is when GitHub's scheduler queue is
  # longest; `docs/CI.md` ("When it really runs") has the sample table showing
  # a `0 7` schedule landing up to +6h34m late.
  #
  # That lateness is also why this sweep does NOT use a rolling "last N hours"
  # window. A 24-hour window on a schedule that can slip six hours drops merges
  # into a gap and never looks at them again, and a miss this check cannot see
  # is indistinguishable from no miss. It sweeps everything merged since each
  # obligation's cut-off instead, so nothing can fall through, and a finding
  # stays PRINTED until it is remediated — an unremediated miss is not less
  # true tomorrow.
  #
  # The run also stays RED until the queue is clear; a red run does not advance
  # the last-green instant. What DREAMCRM-92 added is narrower than "it no
  # longer stays red forever", which is what this comment used to say: once the
  # queue IS clear, a new miss is a NEW red rather than the continuation of an
  # old one, and a green morning is a positive claim that nothing is
  # outstanding. See the step below and the docblock in
  # `scripts/review-sweep.mjs`.
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      ping:
        description: 'Ping the Forge wake endpoint - proves the wire is live. RUN IT FROM A FEATURE BRANCH: the wake anchor reads runs on main, so a ping there becomes the anchor for the next run and can mark a genuinely new entry as standing.'
        required: false
        default: false
        type: boolean

concurrency:
  group: review-sweep
  cancel-in-progress: false

# Three READ scopes and nothing else: `contents` for the checkout,
# `pull-requests` for `gh pr list` (which cannot read a private repo's PRs on
# `contents` alone), and `actions` for `gh run list` — this workflow's own run
# history, which is how it finds out when it last went green (DREAMCRM-92).
# This job writes nothing back to GitHub — see "WHY NOT A COMMENT ON THE
# OFFENDING PR" above for why the write scope `review-gate.yml` holds is not
# wanted here.
#
# All three spellings are real `permissions:` keys. `rulebook-drift.yml` shipped
# a draft asking for `administration: read`, which is not a scope at all: GitHub
# rejected the whole file and published NO check-run, twice, in 0 seconds — a
# failure `gh pr checks` could not show. Nothing in CI validates workflow syntax
# before GitHub does, so `tests/guards/review-sweep.test.ts` checks this block
# against the documented scope list.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  # NOT named `test` or `e2e` — those are main's required contexts, and a
  # second producer of either name can report a green check onto a commit the
  # real suite never ran against. `tests/guards/review-sweep.test.ts` pins
  # this, the same way the review-gate and rulebook-drift guards pin theirs.
  review-sweep:
    name: review-sweep (alarm, gates nothing)
    runs-on: ubuntu-latest
    # One `gh` call and one small node script. No install step anywhere in this
    # job; it has no business inheriting GitHub's 6-hour default.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Written to a file rather than piped so the script stays a pure
      # comparator the guard test can drive with fixtures, offline — the same
      # shape as `scripts/rulebook-drift.mjs`.
      #
      # `--limit 500` is not a guess to leave unchecked: the script is told the
      # limit and goes RED if the list came back truncated before it reached
      # `SWEPT_SINCE`, because a sweep with a hole in it and a sweep that found
      # nothing look identical from the outside. Raise the number when it says
      # so; do not move the cut-off.
      #
      # It was 200, which is about a TEN-DAY window at this repo's rate
      # (#553 to #593 landed in roughly two days). Sentinel's review of #593
      # made the point that lands it here: this alarm's first red run would
      # then most likely have been ABOUT ITSELF, on a brand-new instrument
      # whose entire value is being believed. The real query with
      # `comments,reviews` takes ~7.6s at 200 and GitHub returns 500 fine, so
      # the headroom is cheap.
      - name: List recently merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo ${{ github.repository }} --state merged --limit 500 \
            --json number,title,url,mergedAt,author,labels,comments,reviews \
            > merged-prs.json

      # WHEN DID THIS SWEEP LAST GO GREEN? (DREAMCRM-92.)
      #
      # The summary keeps printing every unremediated entry; the run's EXIT
      # STATUS is keyed on the ones that are new since this instant. Without
      # it, a miss that arrives while an older one is still outstanding
      # produces no new signal at all — that is not a prediction, it is what
      # happened: six consecutive red runs, `35094044453` through
      # `35605207003`, and then #636 merged into the silence carrying
      # `needs-sentinel-review` and editing the gate's own rule list.
      #
      # This does NOT make a dirty queue go green (see the `schedule:` comment
      # above). It makes a CLEAN one mean something, which is what a new miss
      # needs in order to be visible as new.
      #
      # `--status success` is LOAD-BEARING and it is also not trusted on its
      # own. Drop it and this reads the last RUN rather than the last GREEN
      # one, after which every miss is a one-day alarm — red the morning it
      # appears, green the morning after with the finding untouched, which is
      # strictly worse than what it replaced. `lastGreenAt` in
      # `scripts/review-sweep.mjs` therefore filters on `conclusion` itself,
      # and the guard test drives it with a history whose newest run FAILED.
      #
      # `--branch main` because a green `workflow_dispatch` run from a feature
      # branch graded a different version of this file.
      #
      # `|| true` so a throttled or failing lookup does not abort the job: the
      # script reads a missing or unparseable file as a FAILED LOOKUP and fails
      # CLOSED, treating every entry as new and staying red, with the reason in
      # the summary. Letting the step fail would lose the sweep entirely; the
      # opposite default — assuming green — would let one rate-limited API call
      # print a quiet morning over a real miss.
      - name: When did this sweep last go green?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo ${{ github.repository }} --workflow review-sweep.yml \
            --branch main --status success --limit 1 \
            --json databaseId,conclusion,createdAt \
            > last-green.json || true

      # WHEN WAS FORGE LAST UP TO DATE? (The WAKE's anchor.)
      #
      # NOT THE SAME QUESTION AS THE STEP ABOVE, and the whole correction turns
      # on that. A red run does not advance the last-GREEN instant, and an
      # unrouted intake is exactly what keeps this sweep red — so an entry
      # measured against green stays "new" every morning until somebody routes
      # it, and every one of those mornings is a paid Forge run. Measured
      # against the last run that actually told him, it is new exactly once.
      #
      # AND NOT MERELY "THE PREVIOUS RUN", which is where this landed first
      # (Sentinel, second pass on #671). A run that SUPPRESSED a due wake is
      # still a run, so it would advance a plain anchor and the entry it
      # declined to wake for would read as standing from then on — never
      # dispatched at all. One throttled lookup, or one rejected POST, on the
      # single morning an entry is new, and Forge is never told.
      #
      # So each candidate is asked whether its own `Wake Forge` step concluded
      # `success`, which is true both when it woke him and when there was
      # nothing to wake him about — the two states that mean "he is up to
      # date". Same shape as `didScan` in `scripts/error-scan.mjs`, which is
      # where this pattern was written first.
      #
      # NO `--status` FILTER on the list: the sweep is red on exactly the
      # mornings that matter, so filtering on run conclusion would skip them.
      # `--branch main` because a `workflow_dispatch` ping from a feature
      # branch must not become the anchor — and the ping's own input
      # description says to keep it off `main` for the mirror-image reason.
      #
      # EVERY FAILURE PATH ENDS IN AN EMPTY `last-run.json`, which the script
      # reads as a failed lookup: it SUPPRESSES the wake and announces the
      # suppression. That is the one place the wake diverges from failing
      # closed, and `scripts/review-sweep.mjs` carries the argument.
      - name: When was Forge last up to date?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo '[]' > last-run.json

          # `--jq` rather than a node hop: a YAML block scalar does not process
          # escapes, so a `join("\n")` here becomes a backslash and an `n` and
          # the whole list collapses to one line. That is not hypothetical —
          # it shipped in #664 and cost that PR its entire anchor.
          gh run list --repo ${{ github.repository }} --workflow review-sweep.yml \
            --branch main --limit 20 \
            --json databaseId --jq '.[].databaseId' \
            > wake-candidates.txt || : > wake-candidates.txt

          while read -r ID || [ -n "${ID}" ]; do
            [ -n "${ID}" ] || continue
            [ "${ID}" != "${{ github.run_id }}" ] || continue
            gh api "repos/${{ github.repository }}/actions/runs/${ID}/jobs" > wake-jobs.json 2>/dev/null || continue
            if node scripts/review-sweep.mjs woke --jobs wake-jobs.json; then
              gh run view "${ID}" --repo ${{ github.repository }} \
                --json databaseId,conclusion,createdAt --jq '[.]' \
                > last-run.json || echo '[]' > last-run.json
              echo "Forge was last up to date as of run ${ID}."
              break
            fi
          done < wake-candidates.txt

      - name: Which of them merged owing a review or an intake nobody recorded?
        id: sweep
        # `continue-on-error` so the wake step below still runs on a RED sweep —
        # which is the only kind of run that has anything to wake anybody for.
        # The job's real exit status is restored by the last step; without that
        # restore this whole check would go green forever, which is the exact
        # `process.exitCode = 0` mutation `tests/guards/review-sweep.test.ts`
        # exists to refuse.
        continue-on-error: true
        # ONE LINE, deliberately. `tests/guards/review-sweep.test.ts` reads this
        # argument list with a single-line regex to check that the `--limit` it is
        # told matches the one `gh pr list` used, and that it is told where the run
        # history is. A `\` continuation here leaves both guards green while
        # grading nothing.
        run: |
          node scripts/review-sweep.mjs --prs merged-prs.json --limit 500 --last-green last-green.json --last-run last-run.json --wake-out wake.json ${{ (inputs.ping && '--ping') || '' }}

      # A RED SWEEP WAKES FORGE (DREAMCRM-99 deliverable 3).
      #
      # `review-gate.yml` labels `needs-forge-intake` correctly and this sweep
      # grades it correctly. The hop AFTER the label — somebody noticing the red
      # and routing the rule into the rulebook — was owned by nothing that runs.
      # #534's shape cost three days; #658 and #659 both merged with the label
      # unsatisfied and sat until a planning meeting happened to open. §2 records
      # a third. Asking authors to remember harder has failed three times.
      #
      # GITHUB CANNOT DISPATCH ANYBODY — §3 says exactly that about the verdict
      # mention, and it is why the mention rides Multica while the record stays
      # on the PR. Same shape here: the record is the red run and its summary;
      # the WAKE is a POST to a Multica autopilot webhook, which opens an issue
      # assigned to Forge. Two artefacts, two jobs.
      #
      # WHEN IT FIRES is decided entirely by `wakeDecision` in
      # `scripts/review-sweep.mjs`, which is scoped HARDER than the exit status
      # because a wake enqueues a PAID RUN: the intake half only, fresh entries
      # only, and never when the last-green lookup failed (the run still fails
      # closed and goes red — that is free — but an undated window makes every
      # entry look new, and dispatching Forge over a queue he has already seen
      # is how this wire loses the credibility it needs). A suppressed wake is
      # announced rather than silent.
      #
      # AN UNSET SECRET IS A FAILURE OF THIS STEP, and that sentence replaces
      # one that was true before the anchor changed (Sentinel, third pass on
      # #671). `error-scan.yml`'s "not configured is not a failure" contract
      # is about a JOB going red every half hour before anyone has set the
      # thing up. Here the step's conclusion is ALSO the wake's anchor, and a
      # wake that was due and did not happen is not "Forge was told" whatever
      # the reason. So it fails, and the anchor does not move.
      #
      # That costs nothing extra: this branch is only reachable when a wake is
      # DUE, and a due wake means fresh unsatisfied entries, which redden the
      # sweep anyway. The summary still says "Skipped, not passed" — nobody is
      # being told the wake happened.
      #
      # THE SECRET IS THE URL. The Multica webhook token lives in the path, so
      # `FORGE_INTAKE_WAKE_URL` is a credential and nothing here may echo it.
      # `--fail-with-body` and an explicit status check make a rejected POST
      # loud: a wake that silently 404s is indistinguishable from a quiet week,
      # which is the failure class this whole file is about.
      #
      # WHAT THAT CREDENTIAL IS WORTH, written down here rather than left in a
      # review thread (Sentinel, on DREAMCRM-99), because the person who needs
      # it is whoever is standing at this step wondering how carefully to treat
      # it:
      #
      #   * AN ACTIONS SECRET IS NOT SECRET FROM ANYONE WITH REPO WRITE. They
      #     cannot read it from the settings page, but they can add a workflow
      #     that uses it, and a workflow can do whatever it likes with what it
      #     is given. Treat "who can push to this repository" as the list of
      #     people who hold this URL.
      #   * THE BLAST RADIUS IS ONE VERB. The autopilot behind it runs in
      #     `create_issue` mode and is assigned to Forge, so the most a holder
      #     of this URL can do is open issues assigned to him. It grants no
      #     read of anything, and nothing on the deploy path.
      #   * SO THE MITIGATION IS ROTATION, NOT SECRECY. If it leaks, rotate:
      #     `multica autopilot trigger-rotate-url <trigger-id>`, then reset the
      #     secret and dispatch this workflow with `ping: true` from a feature
      #     branch to prove the new one is live. Do not reach for a narrower
      #     scope instead — there is not one; `create_issue` is already the
      #     floor.
      - name: Wake Forge
        if: always()
        env:
          WAKE_URL: ${{ secrets.FORGE_INTAKE_WAKE_URL }}
        run: |
          set -euo pipefail

          if [ ! -f wake.json ]; then
            echo "::error::the sweep wrote no wake decision — it did not get far enough to make one."
            echo "The sweep produced no wake decision, so Forge was not woken." >> "$GITHUB_STEP_SUMMARY"
            # THIS STEP'S CONCLUSION IS THE WAKE ANCHOR. It may only succeed
            # when Forge is up to date — woken, or owed nothing. Without a
            # decision this run knows neither, so it must not advance it.
            exit 1
          fi

          WAKE=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("wake.json","utf8")).wake))')
          REASON=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("wake.json","utf8")).reason))')

          if [ "$WAKE" != "true" ]; then
            echo "Forge was not woken (${REASON})." >> "$GITHUB_STEP_SUMMARY"
            # `undated` is the SUPPRESSED case: a wake was due and this run
            # could not date the window, so it declined to send one. That run
            # must not advance the anchor, or the entry it declined to wake
            # for reads as standing from tomorrow on and Forge is never told.
            # The job is already red whenever this happens — a suppression
            # only occurs when there are unsatisfied entries — so failing
            # here costs nothing that was not already being paid.
            #
            # `clean` and `standing-only` are the opposite: nothing was owed,
            # so he IS up to date and the anchor may move.
            if [ "$REASON" = "undated" ]; then exit 1; fi
            exit 0
          fi

          if [ -z "${WAKE_URL}" ]; then
            echo "::warning::FORGE_INTAKE_WAKE_URL is not set — the intake wake is not configured yet, so nobody was woken."
            {
              echo ""
              echo "#### Forge was NOT woken: the wake is not configured"
              echo ""
              echo "The sweep decided a wake was due (\`${REASON}\`) and \`FORGE_INTAKE_WAKE_URL\` is unset."
              echo "Set it to the Multica autopilot webhook URL. Skipped, not passed."
            } >> "$GITHUB_STEP_SUMMARY"
            # A wake was DUE and did not happen, so this step fails and the
            # anchor does not move — the entry is still new tomorrow and the
            # next configured run wakes him for it.
            #
            # IT FAILS THE JOB TOO, and the earlier version of this comment
            # claimed otherwise (Sentinel, third pass on #671). A step exiting
            # non-zero without `continue-on-error` fails the job; that is the
            # whole mechanism the restore step one below exists to work
            # around. The OUTCOME is unchanged, because this branch is only
            # reachable when a wake is due and that already reddens the sweep
            # — but "the job stays green" was not true of GitHub Actions and
            # a reader would have built on it.
            exit 1
          fi

          CODE=$(curl --silent --show-error --fail-with-body \
            --max-time 30 --retry 2 --retry-connrefused \
            --output wake-response.txt --write-out '%{http_code}' \
            -X POST "${WAKE_URL}" \
            -H 'Content-Type: application/json' \
            --data-binary @wake.json) || {
              echo "::error::the wake POST failed (HTTP ${CODE:-none}). Forge was NOT woken about an unrouted intake."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "#### The wake POST failed (HTTP ${CODE:-none}) — Forge was not woken" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

          echo "::notice::Forge woken (${REASON}), HTTP ${CODE}."
          {
            echo ""
            echo "#### Forge was woken"
            echo ""
            echo "Reason: \`${REASON}\`. The wake POST returned HTTP ${CODE}."
          } >> "$GITHUB_STEP_SUMMARY"

      # RESTORE THE SWEEP'S OWN VERDICT. The grading step is
      # `continue-on-error` only so the wake can run after a red one; this is
      # what keeps the job's colour honest. Without it the sweep reports green
      # every morning while finding everything — the mutation the guard test
      # calls "the ringer must ring".
      - name: Did the sweep pass?
        # `always() &&` so this still prints when the `Wake Forge` step above
        # failed. That step fails only when a wake was DUE and did not happen,
        # which can only occur on a run the sweep is already reddening — but a
        # failed step skips the ones after it by default, and the reader of a
        # red morning should still be told which finding it was about.
        if: always() && steps.sweep.outcome == 'failure'
        run: |
          echo "The sweep reported findings that are new since it last went green - see the summary above."
          exit 1
